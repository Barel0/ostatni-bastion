<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ostatni Bastion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Układ: pasek stanu, plansza z nakładkami, pasek dowodzenia pod spodem. Kolor akcentu zmienia się razem z wybranym zamkiem. */
  --bg:#0d1217; --panel:#141b21; --panel2:#1a232b; --line:#27333d;
  --text:#e8eef2; --muted:#8c9ba7; --accent:#ffb23e;
  --good:#5fd38d; --bad:#ff6b6b; --frost:#6cc7ff; --epic:#c68cff; --rare:#6cc7ff;
  --display:'Chakra Petch',system-ui,sans-serif; --body:'Manrope',system-ui,sans-serif;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:14px;-webkit-tap-highlight-color:transparent}
body{min-height:100%;background:var(--bg)}
#app{max-width:1040px;margin:0 auto;padding:12px 16px 24px;display:flex;flex-direction:column;gap:10px}
.hud{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 20px}
h1{font:700 20px/1 var(--display);letter-spacing:.04em;text-transform:uppercase;margin:0;color:var(--accent);display:flex;flex-direction:column;gap:4px}
h1 small{font:500 11px/1 var(--body);letter-spacing:.06em;color:var(--muted);text-transform:none}
.stats{display:flex;flex-wrap:wrap;gap:6px 18px;font-variant-numeric:tabular-nums}
.st{display:flex;flex-direction:column;gap:2px;min-width:54px}
.st small{color:var(--muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.st b{font:700 17px/1 var(--display)}
.xpbar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:3px}
.xpbar i{display:block;height:100%;background:var(--accent);width:0}
.board{position:relative;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#0f161c;touch-action:none}
canvas{display:block}
#cv{width:100%;height:auto;aspect-ratio:960/576;cursor:crosshair}
.ov{position:absolute;inset:0;display:flex;align-items:flex-start;justify-content:center;background:rgba(8,11,14,.9);padding:14px;overflow:auto}
.ov[hidden]{display:none}
.pan{width:min(820px,100%);display:flex;flex-direction:column;gap:12px;margin:auto}
.pan h2{font:700 24px/1.1 var(--display);margin:0;text-wrap:balance}
.pan h3{font:700 14px/1 var(--display);margin:4px 0 0;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.pan p{margin:0;color:var(--muted);line-height:1.5;max-width:66ch}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.card{position:relative;text-align:left;font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--muted);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:6px;cursor:pointer;min-height:130px}
.card:hover,.card:focus-visible{background:var(--panel2);outline:none;border-color:var(--text)}
.card.r1{border-top-color:var(--rare)} .card.r2{border-top-color:var(--epic)}
.card.r0{background:linear-gradient(160deg,#222d37 0%,var(--panel) 70%)}
.card.r1{background:linear-gradient(160deg,rgba(108,199,255,.34) 0%,rgba(108,199,255,.08) 45%,var(--panel) 80%);border-color:rgba(108,199,255,.45);border-top-color:var(--rare)}
.card.r2{background:linear-gradient(160deg,rgba(198,140,255,.42) 0%,rgba(255,178,62,.14) 50%,var(--panel) 85%);border-color:rgba(198,140,255,.6);border-top-color:var(--epic);box-shadow:0 0 14px rgba(198,140,255,.28)}
.card.r1 .rar{color:var(--rare)} .card.r2 .rar{color:var(--epic)}
.card:hover,.card:focus-visible{filter:brightness(1.14)}
.slot.f.r1{background:linear-gradient(160deg,rgba(108,199,255,.3),transparent 80%)}
.slot.f.r2{background:linear-gradient(160deg,rgba(198,140,255,.38),rgba(255,178,62,.12) 70%,transparent)}
.card .rar{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card strong{font:700 16px/1.2 var(--display)}
.card span:last-of-type{color:var(--muted);line-height:1.4}
.card kbd{position:absolute;right:8px;top:8px;font:600 11px var(--body);color:var(--muted)}
.castles{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.cc{position:relative;text-align:left;font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--ca,var(--muted));border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:3px;cursor:pointer}
.cc canvas{width:88px;height:88px;align-self:center;margin-bottom:2px}
.cc strong{font:700 14px/1.2 var(--display)}
.cc em{font-style:normal;font-size:11px;color:var(--muted)}
.cc span{font-size:12px;line-height:1.35;color:var(--text);opacity:.85}
.cc small{font-size:11px;color:var(--ca,var(--accent));margin-top:2px}
.cc:hover{background:var(--panel2)}
.cc.sel{background:var(--panel2);border-color:var(--ca,var(--accent));box-shadow:0 0 0 1px var(--ca,var(--accent)) inset}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.diffs{display:flex;flex-wrap:wrap;gap:6px}
.df{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 14px;font:700 13px var(--display)}
.df:hover{background:var(--panel2)}
.df.sel{border-color:var(--accent);background:var(--panel2);box-shadow:0 0 0 1px var(--accent) inset}
.df.hc{margin-left:auto;border-color:#7a2a2a;color:#ff8a8a}
.df.hc.sel{border-color:#ff6b6b;box-shadow:0 0 0 1px #ff6b6b inset}
.mrow{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.mrow div{display:flex;flex-direction:column;gap:2px;min-width:0}
.mrow small{color:var(--muted)}
.pips{letter-spacing:2px;color:var(--accent);font-size:10px}
button{font:inherit;color:var(--text);cursor:pointer}
.btn{background:var(--accent);color:#14100a;border:0;border-radius:6px;padding:10px 16px;font:700 14px var(--display);letter-spacing:.04em;text-transform:uppercase}
.btn:hover{filter:brightness(1.08)} .btn:disabled{background:var(--line);color:var(--muted);cursor:default;filter:none}
.col{display:flex;flex-direction:column;gap:6px}
.btn.red{background:#c0352b;color:#fff}
.btn.red{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:1px;user-select:none;-webkit-user-select:none;touch-action:none}
.btn.red small{font:600 10px var(--body);letter-spacing:.04em;text-transform:none;opacity:.8}
.btn.red::after{content:"";position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(255,255,255,.35);pointer-events:none}
.btn.red.hold::after{width:100%;transition:width 3s linear}
#spd{flex:1}
.btn.ghost.exit{display:flex;align-items:center;justify-content:center;color:#ffd23e;border-color:#ffd23e;padding:6px 10px}
.btn.ghost.exit:hover:not(:disabled){background:rgba(255,210,62,.14);border-color:#ffd23e}
.btn.ghost.exit:disabled{opacity:.4}
.ov.title{background:radial-gradient(ellipse at 50% 40%,rgba(8,11,14,.62),rgba(8,11,14,.94))}
.ttl{align-items:center;text-align:center;gap:16px}
.logo{font:700 52px/.95 var(--display);letter-spacing:.08em;color:var(--accent);text-shadow:0 0 28px var(--accent),0 2px 0 #000;margin-top:8px}
.ttl .tag{text-align:center;margin:0 auto}
.mm{display:flex;flex-direction:column;gap:8px;width:min(320px,100%)}
.btn.big{padding:14px 18px;font-size:16px}
.btn.big span{color:var(--epic);margin-left:6px}
.ttl .cur{font-size:12px;color:var(--muted)}
.back{align-self:flex-start}
.card .thumb{width:88px;height:88px;align-self:center;margin:2px 0}
.card .lv{align-self:center;font:700 12px var(--display);letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.help li{margin:0 0 6px;line-height:1.45;color:var(--muted)}
.help li b{color:var(--text)}
/* Popupy nagród: dwie małe okrągłe ikony z licznikiem w górnych rogach (awans zamku po prawej, złoty; nagroda za falę po lewej, niebieski). Po kliknięciu wybór kart pojawia się na środku planszy z przyciemnieniem tła (gra nie jest zatrzymana). */
.lvwrap{position:absolute;top:10px;z-index:3;--pc:var(--accent)}
.lvwrap.R{right:10px}
.lvwrap.L{left:10px;--pc:var(--frost)}
.lvwrap.open{inset:0;z-index:5;display:grid;place-items:center;pointer-events:none}
.lvwrap.open::before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.58)}
.lvwrap[hidden]{display:none!important}
.lvbtn{position:relative;display:flex;align-items:center;justify-content:center;width:46px;height:46px;padding:0;border:0;border-radius:50%;background:var(--pc);color:#14100a;font:700 22px/1 var(--display);box-shadow:0 0 0 0 var(--pc);animation:lvp 1.4s infinite}
.lvbtn::after{content:attr(data-n);position:absolute;right:-3px;top:-3px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:#ff5c5c;color:#fff;font:700 11px/18px var(--display);text-align:center}
.lvbtn.lock{background:var(--panel2);color:var(--muted);animation:none;border:1px solid var(--line)}
.lvbtn.lock::after{background:var(--line);color:var(--muted)}
.lvbtn.open{animation:none;box-shadow:0 0 12px var(--pc)}
.lvwrap.open .lvbtn{position:absolute;top:10px;z-index:2;pointer-events:auto}
.lvwrap.open.R .lvbtn{right:10px}
.lvwrap.open.L .lvbtn{left:10px}
@keyframes lvp{0%{box-shadow:0 0 0 0 rgba(255,255,255,.5)}70%{box-shadow:0 0 0 10px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
.lvpan{width:min(92%,700px);display:grid;grid-template-columns:repeat(3,1fr);gap:12px;background:rgba(13,18,23,.94);border:1px solid var(--pc);border-top:3px solid var(--pc);border-radius:12px;padding:16px;box-shadow:0 0 40px rgba(0,0,0,.7);position:relative;z-index:2;pointer-events:auto}
.lvpan[hidden]{display:none}
.lvpan h4{grid-column:1/-1;text-align:center}
.lvwrap.L .lvpan h4{color:var(--frost)}
.lvwrap.R .lvpan h4{color:var(--accent)}
.lvpan h4{margin:0 0 2px;font:700 15px var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.lvpan .card{min-height:150px;padding:12px;gap:4px}
.lvpan .card.tc{flex-direction:column;text-align:center;align-items:center;justify-content:center;gap:6px}
.lvpan .card.tc>div{display:flex;flex-direction:column;align-items:center;gap:2px}
.lvpan .card .thumb{width:72px;height:72px;margin:0}
.lvpan .card strong{font-size:15px}
.lvpan .card span:last-of-type{font-size:12px}
.btn.sm{padding:6px 10px;font-size:12px}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.ghost:hover:not(:disabled){border-color:var(--text)}
.btn.ghost:disabled{background:transparent;opacity:.5}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:stretch;justify-content:space-between}
.grp{display:flex;flex-wrap:wrap;gap:6px;align-items:stretch}
.tb{display:flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 9px 5px 5px;text-align:left}
.tb canvas{width:30px;height:30px}
.tb span{display:flex;flex-direction:column;gap:2px}
.tb b{font:700 12px var(--display)}
.tb small{color:var(--muted);font-size:11px}
.tb.on{border-color:var(--accent);background:var(--panel2)}
.tb.off{opacity:.45}
.sel .syn{color:#ffd65a}
.tb{touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
#dhint{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);z-index:20;background:rgba(10,14,18,.92);border:1px solid var(--accent);border-radius:10px;padding:6px 12px;font-size:13px;pointer-events:none;opacity:0;transition:opacity .2s;white-space:nowrap}
#dhint.show{opacity:1}
.sk{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 10px;min-width:110px;display:flex;flex-direction:column;gap:2px;overflow:hidden}
.sk b{font:700 12px var(--display)}
.sk small{color:var(--muted);font-size:11px}
.sk i{position:absolute;left:0;bottom:0;height:3px;background:var(--accent);width:calc(var(--p,1)*100%)}
.sk.lock{opacity:.4}
.info{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;min-height:40px;color:var(--muted)}
.sel{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;color:var(--text)}
.sel b{font-family:var(--display)}
.slots{display:flex;gap:4px;flex-wrap:wrap}
.slot{border:1px dashed var(--line);border-radius:4px;padding:3px 7px;font-size:11px;color:var(--muted)}
.slot.f{border-style:solid;color:var(--text);border-color:var(--muted)}
.slot.r1{border-color:var(--rare)} .slot.r2{border-color:var(--epic)}
.hint{font-size:12px}
.fsb{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 9px;font:700 14px var(--display);line-height:1.2}
.fsb:hover{border-color:var(--text)}
.hud .rt{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px}
/* Pełny ekran: plansza dopasowana do wysokości okna */
@media (min-height:541px),(orientation:portrait){
html:fullscreen #app{max-width:none;padding:8px 14px 10px;gap:8px}
html:fullscreen .board{width:min(100%,calc((100vh - 250px)*1.6667));margin:0 auto}
html:-webkit-full-screen #app{max-width:none;padding:8px 14px 10px;gap:8px}
html:-webkit-full-screen .board{width:min(100%,calc((100vh - 250px)*1.6667));margin:0 auto}
}
/* Ranking */
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.rk{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.rk th{font:700 11px var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:4px 8px;border-bottom:1px solid var(--line)}
.rk td{padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.rk td.n{text-align:right;font-family:var(--display);font-weight:700}
.rk .pl{width:32px;color:var(--muted);font:700 14px var(--display)}
.rk tr.top1 .pl{color:#ffd35a}
.rk tr.me{background:rgba(255,255,255,.05)}
.rk .who{display:flex;align-items:center;gap:9px}
.rk .who canvas{width:40px;height:40px;flex:none;border-radius:6px;background:var(--panel);border:2px solid var(--ca,var(--line))}
.rk .who div{display:flex;flex-direction:column;gap:1px;min-width:0}
.rk .who b{font:700 14px var(--display);color:var(--ca,var(--text));overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk .who small{color:var(--muted);font-size:11px}
.nickrow{display:flex;align-items:center;gap:8px;justify-content:center;font-size:12px;color:var(--muted)}
.nickrow input{background:var(--panel);border:1px solid var(--line);border-radius:6px;color:var(--text);font:700 14px var(--display);padding:6px 10px;width:170px;text-align:center}
.nickrow input:focus{border-color:var(--accent);outline:none}
.ov.title .mm{width:min(500px,100%);display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ov.title .mm .btn{padding:11px 14px;font-size:14px}
.ov.title .mm .btn:not(.ghost) span{color:#14100a;opacity:.7;font-size:12px}
.ov.title .mm .btn.wide{grid-column:1/-1}
.ov.title .mm .btn:first-child{grid-column:1/-1;padding:14px 18px;font-size:17px}
.ov.title .logo{font-size:44px}
.ov.title .ttl{gap:12px}
.mm .btn.mode{display:flex;align-items:center;justify-content:space-between}
.mm .btn.mode span{color:var(--muted);font-size:11px;letter-spacing:.06em}
.mm .btn.mystery{border-style:dashed}
.dlg{background:var(--panel);border:2px solid var(--accent);border-radius:12px;padding:26px 30px;box-shadow:0 0 40px rgba(0,0,0,.6);text-align:center;display:flex;flex-direction:column;gap:18px;align-items:center;max-width:min(520px,100%)}
.dlg b{font:700 28px/1.2 var(--display);color:var(--accent);text-wrap:balance}
.dlg.bug{text-align:left;align-items:stretch;width:min(520px,100%);gap:12px}
.dlg.bug h2{margin:0}
.dlg.bug textarea{width:100%;min-height:110px;resize:vertical;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:10px;font:14px/1.4 var(--body)}
.dlg.bug textarea:focus{border-color:var(--accent);outline:none}
.dlg.bug small{color:var(--muted);line-height:1.4}
.dlg.bug .row{display:flex;gap:8px;flex-wrap:wrap}
.dlg.bug a.btn{text-decoration:none;display:inline-block}
@media (max-width:640px){.cards{grid-template-columns:1fr}.card{min-height:0}.meta{grid-template-columns:1fr}.lvpan{grid-template-columns:1fr}.lvpan .card{min-height:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* Telefon: podpowiedź obrotu w pionie (tylko urządzenia dotykowe) */
#rot{display:none;position:fixed;inset:0;z-index:100;background:rgba(8,11,14,.97);flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:28px;text-align:center}
@media (orientation:portrait) and (max-width:700px) and (pointer:coarse){#rot:not(.off){display:flex}}
#rot h2{font:700 22px/1.2 var(--display);margin:0}
#rot p{margin:0;color:var(--muted);line-height:1.5;max-width:34ch}
#rot .btn{width:100%;max-width:320px}
.rotph{width:84px;height:140px;border:5px solid var(--accent);border-radius:16px;position:relative;margin:26px 0 22px;animation:rotp 2.6s ease-in-out infinite}
.rotph::after{content:"";position:absolute;left:50%;bottom:8px;width:26px;height:4px;margin-left:-13px;background:var(--accent);border-radius:2px}
@keyframes rotp{0%,25%{transform:rotate(0)}65%,100%{transform:rotate(-90deg)}}
@media (prefers-reduced-motion:reduce){.rotph{animation:none;transform:rotate(-90deg)}}
/* Telefon poziomo: plansza na cały ekran, HUD i przyciski pływają nad nią */
@media (orientation:landscape) and (max-height:540px){
html,body{overflow:hidden}
#app{max-width:none;padding:0;gap:0;height:100vh;height:100dvh;display:grid;place-items:center}
h1{display:none}
.hud{position:fixed;top:4px;left:50%;transform:translateX(-50%);z-index:6;background:rgba(8,11,14,.72);border:1px solid var(--line);border-radius:10px;padding:3px 10px;gap:12px;flex-wrap:nowrap;width:max-content;max-width:calc(100vw - 16px)}
.hud .rt{gap:10px;flex-wrap:nowrap}
.stats{gap:12px;flex-wrap:nowrap}
.st{min-width:0;flex-direction:row;align-items:baseline;gap:4px}
.st small{font-size:9px;white-space:nowrap}
.st b{font-size:13px}
.st .xpbar{display:none}
.fsb{padding:2px 7px;font-size:12px}
#bug{font-size:0;padding:3px 8px}
#bug::before{content:"\1F41E";font-size:13px}
.board{width:min(100vw,calc(100vh*1.6667));width:min(100vw,calc(100dvh*1.6667));border-radius:0;border:0}
.bar{display:contents}
#towers{position:fixed;left:50%;bottom:4px;transform:translateX(-50%);z-index:6;display:flex;flex-wrap:nowrap;gap:3px;background:rgba(10,14,18,.8);border:1px solid var(--line);border-radius:12px;padding:3px}
.tb{flex-direction:column;padding:3px 5px;background:transparent;border:1px solid transparent;align-items:center}
.tb.on{border-color:var(--accent);background:var(--panel2)}
.tb b,.tb .role{display:none}
.tb canvas{width:30px;height:30px}
.tb small{font-size:10px}
#skills{position:fixed;left:6px;top:50%;transform:translateY(-50%);flex-direction:column;z-index:6;gap:4px}
.sk{min-width:78px;padding:4px 6px}
.sk small{display:none}
.sk b{font-size:10px}
.bar>.grp:last-child{position:fixed;right:6px;top:50%;transform:translateY(-50%);z-index:6;flex-direction:column;gap:4px}
.btn{padding:7px 9px;font-size:12px}
.btn.red small{font-size:9px}
.info{position:fixed;left:50%;bottom:62px;transform:translateX(-50%);z-index:6;min-height:0;background:rgba(10,14,18,.92);border:1px solid var(--line);border-radius:10px;padding:4px 10px;display:none;width:max-content;max-width:calc(100vw - 260px)}
#app.hassel .info{display:flex}
.sel{gap:6px 10px;font-size:12px}
.sel>span:nth-child(2){display:none}
.slots{display:none}
.lvwrap{top:42px}
.lvwrap.open .lvbtn{top:42px}

}
function sendRun(rec){
  if(!COLLECTURL||meta.share===false)return;
  try{
    var body=JSON.stringify({game:'ostatni-bastion',run:rec});
    if(navigator.sendBeacon&&navigator.sendBeacon(COLLECTURL,new Blob([body],{type:'text/plain;charset=UTF-8'})))return;
    if(typeof fetch==='function')fetch(COLLECTURL,{method:'POST',mode:'no-cors',keepalive:true,headers:{'Content-Type':'text/plain;charset=UTF-8'},body:body}).catch(function(){});
  }catch(e){}
}
function loadRuns(){try{var j=JSON.parse(localStorage.getItem(RUNKEY)||'[]');return Array.isArray(j)?j:[]}catch(e){return []}}

}

    g.fillStyle='rgba(255,160,40,.7)';

/* ---------- Ścieżka, tło ---------- */
function buildPath(wp){
  var pts=wp.map(function(p){return {x:p[0]*T+T/2,y:p[1]*T+T/2}});
  var cells={},segs=[],len=0,i;
  for(i=0;i<wp.length-1;i++){
    var a=wp[i],b=wp[i+1],dc=Math.sign(b[0]-a[0]),dr=Math.sign(b[1]-a[1]);
    var c=a[0],r=a[1];
    cells[c+','+r]=1;
    while(c!==b[0]||r!==b[1]){c+=dc;r+=dr;cells[c+','+r]=1}
    var l=dist(pts[i].x,pts[i].y,pts[i+1].x,pts[i+1].y);
    segs.push({a:pts[i],b:pts[i+1],l:l,s:len});
    len+=l;
  }
  return {cells:cells,pts:pts,segs:segs,len:len};
}
function genPath(){
  for(var attempt=0;attempt<60;attempt++){
    var n=ri(3,4),xs=[],x=ri(3,5),i;
    for(i=0;i<n;i++){xs.push(x);x+=ri(4,6)}
    if(xs[n-1]>COLS-7)continue;
    var rows=[ri(2,ROWS-3)],ok=true;
    for(i=0;i<n;i++){
      var nr,tries=0,prev=rows[i];
      do{nr=ri(2,ROWS-3);tries++}while(Math.abs(nr-prev)<4&&tries<40);
      if(Math.abs(nr-prev)<4){ok=false;break}
      rows.push(nr);
    }
    if(!ok)continue;
    var wp=[[0,rows[0]]];
    for(i=0;i<n;i++){wp.push([xs[i],rows[i]]);wp.push([xs[i],rows[i+1]])}
    wp.push([COLS-3,rows[n]]);
    return buildPath(wp);
  }
  return buildPath([[0,3],[6,3],[6,12],[14,12],[14,4],[22,4],[22,13],[27,13]]);
}
function pathPos(d){
  var P=S.path,i;
  if(d<=0)return {x:P.pts[0].x,y:P.pts[0].y};
  for(i=0;i<P.segs.length;i++){
    var s=P.segs[i];
    if(d<=s.s+s.l){var t=(d-s.s)/s.l;return {x:s.a.x+(s.b.x-s.a.x)*t,y:s.a.y+(s.b.y-s.a.y)*t}}
  }
  var e=P.pts[P.pts.length-1];return {x:e.x,y:e.y};
}
function nearPath(c,r){
  return !!(S.path.cells[c+','+r]||S.path.cells[(c+1)+','+r]||S.path.cells[(c-1)+','+r]||S.path.cells[c+','+(r+1)]||S.path.cells[c+','+(r-1)]);
}

function makeBg(){

  for(i=0;i<90;i++){g.globalAlpha=.5;g.beginPath();g.ellipse(rng()*CW,rng()*CH,20+rng()*50,10+rng()*30,0,0,TAU);g.fill()}
  g.globalAlpha=1;

  }
  for(i=0;i<80;i++){

  g.restore();
  pp();g.strokeStyle=th.p0;g.lineWidth=T-5;g.stroke();
  pp();g.strokeStyle=th.p1;g.lineWidth=T-12;g.stroke();
  return c;
}

/* ---------- Pomocnicze logiki ---------- */
function towerCount(type){var n=0;for(var i=0;i<S.towers.length;i++)if(S.towers[i].type===type)n++;return n}
function towerCost(type){return Math.round(TOWER[type].cost*S.mods.cost*S.tinfo[type].tw.c*(1+TCOSTUP*towerCount(type)))}
function towerAt(c,r){for(var i=0;i<S.towers.length;i++){if(S.towers[i].c===c&&S.towers[i].r===r)return S.towers[i]}return null}
function validCell(c,r){return c>=0&&r>=0&&c<COLS&&r<ROWS&&!S.path.cells[c+','+r]&&S.spec[c+','+r]!=='rock'&&!towerAt(c,r)}
/* Pola specjalne: losowo rozrzucone 1–3 kratki od ścieżki, z odstępem między sobą */
function genSpec(){
  var sp={},cells=[],c,r,dc,dr,i,j;
  for(c=1;c<COLS-4;c++)for(r=1;r<ROWS-1;r++){
    if(S.path.cells[c+','+r])continue;
    var dm=9;
    for(dc=-3;dc<=3;dc++)for(dr=-3;dr<=3;dr++)if(S.path.cells[(c+dc)+','+(r+dr)])dm=Math.min(dm,Math.max(Math.abs(dc),Math.abs(dr)));
    if(dm>=1&&dm<=3)cells.push({c:c,r:r,d:dm});
  }
  for(i=cells.length-1;i>0;i--){j=Math.floor(Math.random()*(i+1));var tmp=cells[i];cells[i]=cells[j];cells[j]=tmp}
  var kinds=['hill','hill','hill','power','power','mine','rock','rock','rock'],picked=[];
  kinds.forEach(function(k){
    for(var n=0;n<cells.length;n++){
      var q=cells[n];if(q.used||(k==='rock'&&q.d>2))continue;
      var far=true;
      for(var p=0;p<picked.length;p++)if(Math.max(Math.abs(picked[p].c-q.c),Math.abs(picked[p].r-q.r))<3){far=false;break}
      if(!far)continue;
      q.used=true;picked.push(q);sp[q.c+','+q.r]=k;break;
    }
  });
  return sp;
}
/* Mapa synergii dla wybranego zamku: S.synm['typ<sąsiad'] = lista efektów */
function buildSyn(){
  var mp={};
  function add(to,from,e,n){(mp[to+'<'+from]=mp[to+'<'+from]||[]).push({e:e,n:n})}
  SYNU.concat(CSYN[S.castle.id]||[]).forEach(function(p){
    if(p[2])add(p[0],p[1],p[2],p[4]);
    if(p[3])add(p[1],p[0],p[3],p[4]);
  });
  S.synm=mp;
}
function effText(e){
  var p=[];
  function pc(v){return Math.round(v*100)+'%'}
  if(e.dmg)p.push('+'+pc(e.dmg)+' obr.');
  if(e.rate)p.push('+'+pc(e.rate)+' szybk.');
  if(e.range)p.push('+'+pc(e.range)+' zasięgu');
  if(e.splash)p.push('+'+pc(e.splash)+' wybuchu');
  if(e.chain)p.push('+'+e.chain+' cel łańcucha');
  if(e.crit)p.push('+'+pc(e.crit)+' krytyka');
  if(e.slowed)p.push('+'+pc(e.slowed)+' obr. w spowolnionych');
  if(e.pois)p.push('+'+pc(e.pois)+' obr. w zatrutych');
  if(e.tox)p.push('pioruny zatruwają');
  return p.join(', ');
}
/* Sąsiedztwo wieży typu `type` na polu (c,r). `self` to istniejąca wieża (null = podgląd budowy). Wynik jest liczony od nowa tylko po zmianie układu wież (S.tver). */
function synCalc(type,c,r,self){
  var o={same:0,kinds:0,dm:1,rt:1,rg:1,sp:1,ch:0,cr:0,sb:0,pb:0,tox:0,uf:1,pairs:[],links:[],sameN:[],spot:null},seen={},idx=0,i,n,e,si=self?S.towers.indexOf(self):S.towers.length;
  for(i=0;i<S.towers.length;i++){
    n=S.towers[i];if(n===self)continue;
    if(n.type===type&&i<si)idx++;
    if(Math.abs(n.c-c)<=1&&Math.abs(n.r-r)<=1){
      if(n.type===type){o.same++;o.sameN.push(n)}
      else{
        if(!seen[n.type]){seen[n.type]=1;o.kinds++}
        var lst=S.synm[type+'<'+n.type];
        if(lst){
          o.links.push(n);
          lst.forEach(function(x){
            e=x.e;
            if(e.dmg)o.dm*=1+e.dmg;if(e.rate)o.rt*=1+e.rate;if(e.range)o.rg*=1+e.range;if(e.splash)o.sp*=1+e.splash;
            if(e.chain)o.ch+=e.chain;if(e.crit)o.cr+=e.crit;if(e.slowed)o.sb+=e.slowed;if(e.pois)o.pb+=e.pois;if(e.tox)o.tox=1;
            o.pairs.push(x.n+': '+effText(e));
          });
        }
      }
    }
  }
  o.rt*=1-SAMEPEN*Math.min(o.same,SAMEMAX);
  o.dm*=1+MIXBON*Math.min(o.kinds,MIXMAX);
  o.cr=Math.min(.75,o.cr);
  o.uf=Math.max(.5,1-TUPDEC*idx);
  var sk=S.spec[c+','+r];
  if(sk==='hill'){o.rg*=1.2;o.spot=SPEC.hill}
  else if(sk==='power'){o.rt*=1.15;o.spot=SPEC.power}
  else if(sk==='mine')o.spot=SPEC.mine;
  return o;
}
function synOf(t){
  if(t.sv!==S.tver||!t.sy){t.sy=synCalc(t.type,t.c,t.r,t);t.sv=S.tver}
  return t.sy;
}
function synText(o){
  var p=[];
  if(o.same)p.push('−'+Math.round(SAMEPEN*Math.min(o.same,SAMEMAX)*100)+'% szybk. ('+o.same+'× ten sam typ obok)');
  if(o.kinds)p.push('+'+Math.round(MIXBON*Math.min(o.kinds,MIXMAX)*100)+'% obr. ('+o.kinds+' inne typy obok)');
  o.pairs.forEach(function(x){p.push(x)});
  if(o.spot)p.push(o.spot.n+': '+o.spot.d);
  return p;
}
function tstat(t){
  var b=TOWER[t.type],L=S.tup[t.type]-1,m=S.mods,sy=synOf(t);
  var buff=S.buffT>0?S.rBuff:1,aura=1,Lf=L*sy.uf;
  if(m.aura&&dist(t.x,t.y,S.hero.x,S.hero.y)<170)aura=1+m.aura;
  var tw=tinfo(t.type).tw,dm=(1+.3*Lf)*m.tdmg*tw.d*sy.dm;
  return {dmg:b.dmg*dm,rate:b.rate*(1+.08*Lf)*m.trate*buff*aura*tw.r*sy.rt,range:(b.range+7*Lf)*m.trange*tw.g*sy.rg,
    splash:b.splash?(b.splash+4*Lf)*sy.sp:0,slow:b.slow?Math.min(.8,b.slow+.04*Lf):0,slowT:b.slowT,
    pdps:b.pdps?b.pdps*dm:0,pT:b.pT?b.pT+.4*Lf:0,chain:b.chain?b.chain+Math.floor(L/2)+sy.ch:0,color:tinfo(t.type).col,proj:b.proj,kind:b.kind,
    crit:sy.cr,sb:sy.sb,pb:sy.pb,tox:sy.tox};
}
function hstat(){
  var m=S.mods;
  return {dmg:14*m.hdmg,rate:1.5*m.hrate,range:150+m.hrange,crit:Math.min(.75,m.crit),multi:m.multi};
}
function cdOf(k){return CD[k](S.skills[k])*S.mods.cdr}

function sparks(x,y,color,n){for(var i=0;i<n;i++){var a=rnd(0,TAU);S.fx.push({k:'p',x:x,y:y,vx:Math.cos(a)*rnd(20,70),vy:Math.sin(a)*rnd(20,70),t:0,life:.3,color:color})}}
function tryBuild(c,r){
  if(!S.build||!validCell(c,r))return;
  if(towerCount(S.build)>=TLIMIT)return;
  var cost=towerCost(S.build);
  if(S.gold<cost)return;

  var t={type:S.build,c:c,r:r,x:c*T+T/2,y:r*T+T/2,cd:rnd(0,.3),spent:cost,ang:-Math.PI/2,rec:0,ramp:0,lt:null,sv:-1,sy:null};
  S.towers.push(t);S.tver++;S.sel=t;S.log.bd.push([S.wave,t.type,c,r,0]);
  S.fx.push({k:'ring',x:t.x,y:t.y,r:4,max:24,t:0,life:.3,color:tinfo(t.type).col});
  sparks(t.x,t.y,tinfo(t.type).col,6);
}
function sellTower(t){
  if(!t)return;
  S.gold+=Math.floor(t.spent*.7);S.log.bd.push([S.wave,t.type,t.c,t.r,1]);
  sparks(t.x,t.y,'#8c9ba7',6);
  S.towers=S.towers.filter(function(x){return x!==t});S.tver++;

}

/* ---------- Fale ---------- */
function genWave(w){
  var q=[],n=Math.round((6+Math.floor(w*2.2))*S.diff.cnt),i;
  for(i=0;i<n;i++){
    var r=Math.random(),type='grunt';
    if(w>=2&&r<.25)type='runner';
    else if(w>=4&&r<.4)type='brute';
    else if(w>=3&&r<.55)type='swarm';
    else if(w>=6&&r<.7)type='shield';
    if(type==='swarm'){for(var k=0;k<4;k++)q.push({type:'swarm',gap:.3});q.push({type:'grunt',gap:.8})}
    else q.push({type:type,gap:type==='runner'?.55:.9});
  }
  if(w%5===0)q.push({type:'boss',gap:1});
  return q;
}
function startWave(){
  if(S.modal||S.phase!=='build')return;
  S.wave++;S.phase='wave';S.spawnQ=genWave(S.wave);S.spawnT=.8;S.sel=null;
  var boss=S.wave%5===0,bb=S.fac.bd[Math.min(BOSS.length,Math.max(1,Math.round(S.wave/5)))-1];

}
/* d0 i child: wrogowie wyrzuceni przez Streamera (frakcja infl) pojawiają się w miejscu jego śmierci i nie rozpadają się dalej. */
function spawn(type,d0,child){

    hl:F.mech==='heal'&&type==='brute',rg:F.mech==='rage',sh:F.mech==='shield'&&type!=='boss'?hp*.2:0,sp:F.mech==='split'&&type==='brute'&&!child,
    sl:1,slowT:0,poisT:0,pd:0,flash:0,dead:false,ph:rnd(0,TAU),acc:0,tn:0});

}

/* ---------- Walka ---------- */
/* Rodzaje obrażeń (k): 'splash' wybuchy, 'energy' Tesla i Laser, 'dot' trucizna (ignoruje pancerz). Pancerz odejmuje stałą wartość od każdego trafienia (min. 35%). */
function dealDamage(e,dmg,quiet,crit,k){
  if(e.dead)return;
  if(e.inv>0)return;
  if(k){if(e.rs&&e.rs[k])dmg*=e.rs[k]}
  if(e.arm&&k!=='dot')dmg=Math.max(dmg*.35,dmg-e.arm);
  if(e.sh>0){var ab=Math.min(e.sh,dmg);e.sh-=ab;dmg-=ab;e.flash=.08}
  e.hp-=dmg;if(dmg>0)e.flash=.08;
  if(!quiet){
    e.acc+=dmg;
    if(e.tn<=0&&e.acc>=1&&S.fx.length<260){
      S.fx.push({k:'txt',x:e.x+rnd(-5,5),y:e.y-e.r-3,vy:-30,t:0,life:.55,text:String(Math.round(e.acc)),color:crit?'#ffffff':'#d7e0e6',size:crit?13:9});
      e.acc=0;e.tn=.16;
    }
  }
  if(e.hp<=0){
    if(e.bid==='god'&&!e.rev){
      e.rev=true;e.hp=e.max*.5;e.inv=2.2;e.sl=1;e.slowT=0;e.poisT=0;e.flash=.3;S.shake=Math.max(S.shake,.3);
      S.fx.push({k:'ring',x:e.x,y:e.y,r:5,max:120,t:0,life:.9,color:'#ffe38a',fill:true});
      S.fx.push({k:'ring',x:e.x,y:e.y,r:3,max:70,t:0,life:.6,color:'#ffffff'});
      S.fx.push({k:'txt',x:e.x,y:e.y-e.r-16,vy:-18,t:0,life:1.6,text:'WSKRZESZENIE!',color:'#ffe38a',size:15});
      for(var q=0;q<24;q++){var aa=rnd(0,TAU);S.fx.push({k:'p',x:e.x,y:e.y,vx:Math.cos(aa)*rnd(30,110),vy:Math.sin(aa)*rnd(30,110)-30,t:0,life:.9,color:q%2?'#ffe38a':'#ffffff'})}
    }else kill(e);
  }
}
function kill(e){
  e.dead=true;S.kills++;S.score+=e.pts||0;
  if(e.type==='boss'){S.bosses++;S.shake=Math.max(S.shake,.3);S.fx.push({k:'ring',x:e.x,y:e.y,r:5,max:80,t:0,life:.5,color:e.color})}
  S.gold+=Math.round(e.gold*S.mods.gold);
  gainXp(e.xp*S.mods.xp*XPS);
  if(e.sp)for(var q=0;q<3;q++)spawn('swarm',Math.max(0,e.d-q*10),true);
  for(var i=0;i<(e.type==='boss'?20:6);i++){var a=rnd(0,TAU);S.fx.push({k:'p',x:e.x,y:e.y,vx:Math.cos(a)*rnd(30,100),vy:Math.sin(a)*rnd(30,100),t:0,life:.45,color:i%3?e.color:'#e9ffe0'})}
}
function gainXp(v){
  var h=S.hero;h.xp+=v;
  while(h.xp>=h.need){h.xp-=h.need;h.lvl++;h.need=Math.floor(h.need*1.38+12);S.rq.push({k:'level'});
    S.fx.push({k:'ring',x:h.x,y:h.y,r:6,max:60,t:0,life:.6,color:S.castle.acc});
    S.fx.push({k:'txt',x:h.x,y:h.y-34,vy:-22,t:0,life:1.1,text:'AWANS!',color:S.castle.acc,size:15})}
}
function nearest(x,y,range,skip){
  var best=null,bd=1e9;
  for(var i=0;i<S.enemies.length;i++){
    var e=S.enemies[i];if(e.dead||(skip&&skip.indexOf(e)>=0))continue;
    var d=dist(x,y,e.x,e.y);
    if(d<=range+e.r&&d<bd){bd=d;best=e}
  }
  return best;
}
function furthest(x,y,range,minR){
  var best=null,bp=-1;
  for(var i=0;i<S.enemies.length;i++){
    var e=S.enemies[i];if(e.dead)continue;
    var dd=dist(x,y,e.x,e.y);
    if(dd<=range+e.r&&(!minR||dd>=minR)&&e.d>bp){bp=e.d;best=e}
  }
  return best;
}
/* Snajper celuje w najmocniejszego wroga (najwięcej HP) w zasięgu */
function strongest(x,y,range){
  var best=null,bh=-1;
  for(var i=0;i<S.enemies.length;i++){
    var e=S.enemies[i];if(e.dead)continue;
    if(dist(x,y,e.x,e.y)<=range+e.r&&e.hp>bh){bh=e.hp;best=e}
  }
  return best;
}
/* Mnożnik z synergii: obrażenia większe w spowolnionych (sb) i zatrutych (pb) celach */
function synMul(e,sb,pb){var m=1;if(sb&&e.slowT>0)m*=1+sb;if(pb&&e.poisT>0)m*=1+pb;return m}
function explode(x,y,r,dmg,color,sb,pb){
  S.fx.push({k:'ring',x:x,y:y,r:4,max:r,t:0,life:.28,color:color,fill:true});
  for(var j=0;j<3;j++)S.fx.push({k:'smoke',x:x+rnd(-6,6),y:y+rnd(-6,6),t:0,life:.5,r:5,max:14+r*.2});
  if(r>60)S.shake=Math.max(S.shake,.1);
  for(var i=0;i<S.enemies.length;i++){var e=S.enemies[i];if(!e.dead&&dist(x,y,e.x,e.y)<=r+e.r)dealDamage(e,dmg*synMul(e,sb,pb),false,false,'splash')}
}
function critHp(){return S.baseHp>0&&(S.hc||S.baseHp<=1||S.baseHp/S.baseMax<=.05)}
function novaRad(){return 85+12*S.skills.q+(S.mods.nova?30:0)}
function frostRad(){return 105+12*S.skills.e}
function frostSlow(){return .3+.05*S.skills.e}
function castQ(){
  var L=S.skills.q;if(!L||S.cds.q>0)return;
  var rad=novaRad(),dmg=(30+26*L)*S.mods.hdmg*(S.mods.nova?1.5:1),h=S.hero;
  S.fx.push({k:'ring',x:h.x,y:h.y,r:6,max:rad,t:0,life:.4,color:S.castle.acc,fill:true});
  S.fx.push({k:'ring',x:h.x,y:h.y,r:2,max:rad*.7,t:0,life:.3,color:'#ffffff'});
  S.shake=Math.max(S.shake,.08);
  for(var i=0;i<S.enemies.length;i++){var e=S.enemies[i];if(!e.dead&&dist(h.x,h.y,e.x,e.y)<=rad+e.r)dealDamage(e,dmg)}
  S.cds.q=cdOf('q');
}
function castR(){
  var L=S.skills.r;if(!L||S.cds.r>0)return;
  S.buffT=4+L;S.rBuff=1.35+.1*L;
  S.fx.push({k:'ring',x:S.hero.x,y:S.hero.y,r:6,max:90,t:0,life:.5,color:'#ffffff'});
  S.cds.r=cdOf('r');
}

function fireTower(t,st,target){
  var i,b=TOWER[t.type],cm=(st.crit&&Math.random()<st.crit)?2:1,dmg=st.dmg*cm;
  t.ang=Math.atan2(target.y-t.y,target.x-t.x);t.rec=.16;
  if(st.kind==='bolt'){
    var list=[target],cur=target,pts=[{x:t.x,y:t.y-6},{x:target.x,y:target.y}];
    for(i=0;i<st.chain;i++){var nx=nearest(cur.x,cur.y,80,list);if(!nx)break;list.push(nx);pts.push({x:nx.x,y:nx.y});cur=nx}
    for(i=0;i<list.length;i++){
      dealDamage(list[i],dmg*Math.pow(.75,i)*synMul(list[i],st.sb,st.pb),false,cm>1,'energy');
      if(st.tox){list[i].poisT=Math.max(list[i].poisT,2.5);list[i].pd=Math.max(list[i].pd,10)}
    }
    S.fx.push({k:'bolt',pts:pts,t:0,life:.2,color:st.color});
  }else if(st.kind==='beam'){
    if(t.lt===target)t.ramp=Math.min(2,t.ramp+.1);else{t.lt=target;t.ramp=0}
    dealDamage(target,dmg*(1+t.ramp)*(target.bid==='hunter'?1.8:1)*synMul(target,st.sb,st.pb),true,false,'energy');
    S.fx.push({k:'beam',x1:t.x+Math.cos(t.ang)*10,y1:t.y+Math.sin(t.ang)*10,x2:target.x,y2:target.y,t:0,life:.1,color:st.color,w:1.4+t.ramp});
  }else if(st.kind==='mortar'){
    var dd=dist(t.x,t.y,target.x,target.y),dur=Math.max(.6,dd/190);
    var pp=pathPos(Math.min(S.path.len,target.d+target.spd*dur*.85));
    S.shots.push({x:t.x,y:t.y,sx:t.x,sy:t.y,tx:pp.x,ty:pp.y,arc:true,el:0,dur:dur,p:0,dmg:dmg,splash:st.splash,sb:st.sb,pb:st.pb,color:st.color,kind:'mortar',r:4});
  }else{
    S.shots.push({x:t.x,y:t.y,tg:target,dmg:dmg,crit:cm>1,sb:st.sb,pb:st.pb,speed:st.proj,color:st.color,kind:st.kind,r:st.kind==='ball'?4:2.5,splash:st.splash,slow:st.slow,slowT:st.slowT,pd:st.pdps,pT:st.pT,trail:(st.kind==='ball'||st.kind==='snipe')?[]:null,a:t.ang});
  }
}

/* ---------- Aktualizacja ---------- */
function update(dt){
  if(!S||S.modal)return;
  var i,j,h=S.hero,hs=hstat();
  S.time+=dt;
  for(var k in S.cds)if(S.cds[k]>0)S.cds[k]=Math.max(0,S.cds[k]-dt);
  if(S.buffT>0)S.buffT=Math.max(0,S.buffT-dt);
  if(S.shake>0)S.shake=Math.max(0,S.shake-dt);
  if(S.hit>0)S.hit=Math.max(0,S.hit-dt);
  if(h.rec>0)h.rec-=dt;
  if(S.banner){S.banner.t+=dt;if(S.banner.t>S.banner.life)S.banner=null}

  // pasywne umiejętności zamku
  if(S.skills.q&&S.cds.q<=0&&nearest(h.x,h.y,novaRad()))castQ();
  if(S.skills.r&&S.cds.r<=0&&S.phase==='wave'&&S.enemies.length)castR();

  // spawn
  if(S.phase==='wave'){
    S.spawnT-=dt;
    if(S.spawnQ.length&&S.spawnT<=0){var it=S.spawnQ.shift();spawn(it.type);S.spawnT=it.gap}
  }

  // wrogowie
  for(i=0;i<S.enemies.length;i++){
    var e=S.enemies[i];if(e.dead)continue;
    var m=1;
    if(e.slowT>0){e.slowT-=dt;m=Math.min(m,e.sl)}
    if(e.inv>0){e.inv-=dt;m=0}
    if(S.skills.e&&dist(h.x,h.y,e.x,e.y)<=frostRad())m=Math.min(m,1-Math.min(.85,frostSlow()*(e.bid==='hunter'?1.6:1)));
    if(e.dg>0)e.dg-=dt;
    if(e.flash>0)e.flash-=dt;
    if(e.tn>0)e.tn-=dt;
    if(e.poisT>0){e.poisT-=dt;dealDamage(e,e.pd*dt,true,false,'dot');if(e.dead)continue}
    if(e.rg&&e.hp<e.max*.5)m*=1.4;
    if(e.hl){for(var hj=0;hj<S.enemies.length;hj++){var ho=S.enemies[hj];if(ho!==e&&!ho.dead&&ho.hp<ho.max&&dist(e.x,e.y,ho.x,ho.y)<=HEAL_R)ho.hp=Math.min(ho.max,ho.hp+ho.max*.035*dt)}}
    e.d+=e.spd*m*dt;
    if(e.d>=S.path.len){
      e.dead=true;S.log.lk++;S.baseHp-=e.dmg;S.shake=Math.max(S.shake,.25);S.hit=.4;
      S.fx.push({k:'ring',x:e.x,y:e.y,r:4,max:36,t:0,life:.35,color:'#ff6b6b'});
      S.fx.push({k:'txt',x:h.x,y:h.y-30,vy:-26,t:0,life:.8,text:'-'+e.dmg,color:'#ff6b6b',size:13});
      continue;
    }
    var p=pathPos(e.d);e.ang=Math.atan2(p.y-e.y,p.x-e.x);e.x=p.x;e.y=p.y;
  }

  // zamek strzela
  h.cd-=dt;
  if(h.cd<=0){
    var picked=[],tg;
    for(i=0;i<1+hs.multi;i++){tg=nearest(h.x,h.y,hs.range,picked);if(tg)picked.push(tg)}
    if(picked.length){
      h.ang=Math.atan2(picked[0].y-h.y,picked[0].x-h.x);h.rec=.14;
      for(i=0;i<picked.length;i++){
        var crit=Math.random()<hs.crit;
        S.shots.push({x:h.x,y:h.y-8,tg:picked[i],dmg:hs.dmg*(crit?2:1),speed:520,color:crit?'#ffffff':S.castle.proj,kind:S.castle.pst,r:crit?3.5:2.8,crit:crit,trail:null,a:h.ang});
      }
      h.cd=1/hs.rate;
    }else h.cd=0;
  }
  if(critHp()){
    if(Math.random()<dt*40)S.fx.push({k:'p',x:h.x+rnd(-14,14),y:h.y-4,vx:rnd(-12,12),vy:rnd(-70,-35),t:0,life:.7,color:Math.random()<.5?'#ff9a2e':'#ffd35a'});
    if(Math.random()<dt*10)S.fx.push({k:'smoke',x:h.x+rnd(-12,12),y:h.y-14,t:0,life:1.1,r:4,max:15,up:true});
  }
  if(S.baseHp/S.baseMax<.35&&Math.random()<dt*7)S.fx.push({k:'smoke',x:h.x+rnd(-10,10),y:h.y-12,t:0,life:.9,r:3,max:11,up:true});

  // wieże
  for(i=0;i<S.towers.length;i++){
    var t=S.towers[i],st=tstat(t);
    t.cd-=dt;if(t.rec>0)t.rec-=dt;
    t.sul=false;
    for(j=0;j<S.enemies.length;j++){var se=S.enemies[j];if(se.bid==='sultan'&&!se.dead&&dist(t.x,t.y,se.x,se.y)<=SULTAN_R){t.sul=true;break}}
    if(t.cd<=0){
      var target=t.type==='sniper'?strongest(t.x,t.y,st.range):furthest(t.x,t.y,st.range,t.type==='mortar'?MORTAR_MIN:0);
      if(target){fireTower(t,st,target);t.cd=1/(st.rate*(t.sul?.55:1))}
      else{t.cd=0;if(st.kind==='beam')t.ramp=Math.max(0,t.ramp-dt)}
    }
  }

  // pociski
  for(i=0;i<S.shots.length;i++){
    var s=S.shots[i];
    if(s.arc){
      s.el+=dt;s.p=Math.min(1,s.el/s.dur);
      s.x=s.sx+(s.tx-s.sx)*s.p;s.y=s.sy+(s.ty-s.sy)*s.p;
      if(s.p>=1){s.done=true;explode(s.tx,s.ty,s.splash,s.dmg,s.color,s.sb,s.pb)}
      continue;
    }
    if(s.tg){
      if(s.tg.dead){if(s.splash)explode(s.x,s.y,s.splash,s.dmg,s.color,s.sb,s.pb);s.done=true;continue}
      s.tx=s.tg.x;s.ty=s.tg.y;
    }
    var ddx=s.tx-s.x,ddy=s.ty-s.y,dl=Math.hypot(ddx,ddy),stp=s.speed*dt;
    if(s.trail){s.trail.push({x:s.x,y:s.y});if(s.trail.length>6)s.trail.shift()}
    if(s.kind==='ball'&&Math.random()<dt*22)S.fx.push({k:'smoke',x:s.x,y:s.y,t:0,life:.35,r:2,max:6});
    if(dl>0.001)s.a=Math.atan2(ddy,ddx);
    if(dl<=stp+(s.tg?s.tg.r:0)){
      s.done=true;
      if(s.splash)explode(s.tx,s.ty,s.splash,s.dmg,s.color,s.sb,s.pb);
      else if(s.tg){
        if(s.tg.bid==='hunter'&&Math.random()<(s.tg.slowT>0?.2:.45)){
          s.tg.dg=.35;
          S.fx.push({k:'txt',x:s.tg.x,y:s.tg.y-s.tg.r-6,vy:-26,t:0,life:.6,text:'UNIK!',color:'#ff9ab0',size:11});
          continue;
        }
        dealDamage(s.tg,s.dmg*synMul(s.tg,s.sb,s.pb),false,s.crit);
        if(s.slow){s.tg.sl=1-Math.min(.85,s.slow*(s.tg.bid==='hunter'?1.6:1));s.tg.slowT=s.slowT}
        if(s.pd){s.tg.poisT=s.pT;s.tg.pd=Math.max(s.tg.pd,s.pd)}
        sparks(s.tx,s.ty,s.color,3);
      }
    }else{s.x+=ddx/dl*stp;s.y+=ddy/dl*stp}
  }

  // efekty
  for(i=0;i<S.fx.length;i++){var f=S.fx[i];f.t+=dt;if(f.k==='p'){f.x+=f.vx*dt;f.y+=f.vy*dt}else if(f.k==='txt'){f.y+=f.vy*dt}else if(f.k==='smoke'&&f.up){f.y-=14*dt}}

  S.enemies=S.enemies.filter(function(e){return !e.dead});
  S.shots=S.shots.filter(function(s){return !s.done});
  S.fx=S.fx.filter(function(f){return f.t<f.life});

  if(S.baseHp<=0){endRun(false);return}
  if(S.phase==='wave'&&!S.spawnQ.length&&!S.enemies.length){
    var mg=0;S.towers.forEach(function(tw){if(S.spec[tw.c+','+tw.r]==='mine')mg+=6});
    S.gold+=20+5*S.wave+mg;S.phase='build';S.shots=[];logWaveEnd();
    if(S.mods.regen)S.baseHp=Math.min(S.baseMax,S.baseHp+S.mods.regen);
    if(S.wave>=MAXWAVE){endRun(true);return}
    S.rq.push({k:'wave',w:S.wave});
  }
}

/* ---------- Karty ---------- */
function skillCards(){
  var out=[];
  ['q','e','r'].forEach(function(k){
    var L=S.skills[k];if(L>=5)return;
    var desc={q:'Pasywna: zamek sam wywołuje wybuch, gdy zbliżają się wrogowie. Więcej obrażeń i zasięgu, krótsze odnowienie.',e:'Pasywna: stała strefa spowalniająca wrogów wokół zamku. Większy zasięg i mocniejsze spowolnienie.',r:'Pasywna: co jakiś czas wieże same strzelają szybciej przez kilka sekund.'}[k];
    out.push({id:'s_'+k+(L+1),k:'skill',r:L===0?1:0,n:L?skn(k)+' '+ROMAN[L+1]:'Odblokuj: '+skn(k),d:desc,ap:function(){S.skills[k]++}});
  });
  return out;
}
function towerUpDesc(k,nl){
  var b=TOWER[k],parts=['+30% obrażeń','+8% szybkostrzelności','+7 zasięgu'];
  if(b.splash)parts.push('większy wybuch');
  if(b.slow)parts.push('mocniejsze spowolnienie');
  if(b.pdps)parts.push('dłuższa trucizna');
  if(b.chain&&nl%2===1)parts.push('+1 cel łańcucha');
  return parts.join(', ')+' (wszystkie wieże tego typu).';
}
function towerUpCards(){
  var out=[],seen={};
  S.towers.forEach(function(t){seen[t.type]=1});
  if(!S.towers.length)seen.arrow=1;
  TKEYS.forEach(function(k){
    if(!seen[k])return;
    var L=S.tup[k];if(L>=5)return;
    var nl=L+1;
    out.push({tw:k,nl:nl,id:'tu_'+k+nl,k:'tower',r:nl>=5?2:nl>=3?1:0,w:2.5,n:tinfo(k).n+' · ulepszenie '+nl,d:towerUpDesc(k,nl),ap:function(){S.tup[k]=nl}});
  });
  return out;
}
function drawCards(kinds){
  var pool=[];
  CARDS.forEach(function(c){
    if(kinds.indexOf(c.k)<0)return;
    if(c.k==='item'&&(S.items.indexOf(c.id)>=0||S.items.length>=MAXITEMS))return;
    if(c.ok&&!c.ok())return;
    if(S.hc&&c.hp)return;
    pool.push(c);
  });
  if(kinds.indexOf('skill')>=0)pool=pool.concat(skillCards());
  if(kinds.indexOf('tower')>=0)pool=pool.concat(towerUpCards());
  var out=[];
  while(out.length<3&&pool.length){
    var tw=0,ws=pool.map(function(c){var w=[60,30,10][c.r]*(c.r?1+S.wave*.04:1)*(c.w||1);tw+=w;return w});
    var x=Math.random()*tw,idx=0;
    while(idx<pool.length-1&&x>ws[idx]){x-=ws[idx];idx++}
    out.push(pool.splice(idx,1)[0]);
  }
  return out;
}
function openCards(kind){
  var cards=drawCards(kind==='level'?['hero','skill','item','eco']:['tower']);
  if(!cards.length)return;
  S.cards={kind:kind,list:cards};S.modal='cards';renderOverlay();

      return '<button type="button" class="card r'+c.r+'" data-act="lv-pick" data-i="'+i+'"><span class="rar">'+RAR[c.r]+' · '+TAG[c.k]+'</span><strong>'+c.n+'</strong><span>'+c.d+'</span><kbd>'+(i+1)+'</kbd></button>';
    }).join('');

function pickCard(i){
  if(S.modal!=='cards'||!S.cards||!S.cards.list[i])return;
  var c=S.cards.list[i];S.log.pk.push([S.wave,S.cards.kind,c.id,S.hero.lvl]);c.ap();

function endRun(win){
  var cr=Math.round((S.wave*2+S.bosses*5+(win?25:0))*S.diff.rw);
  S.live=false;S.earned=cr;S.result=win?'win':'lose';meta.crystals+=cr;
  var gain=Math.round((S.wave*15+Math.floor(S.kills/4)+S.bosses*25+(win?120:0))*S.diff.rw);
  var c=cxOf(S.castle.id),from=c.lv;
  c.xp+=gain;
  while(c.lv<CXMAX&&c.xp>=cxNeed(c.lv)){c.xp-=cxNeed(c.lv);c.lv++}
  if(c.lv>=CXMAX)c.xp=0;
  S.cxGain={gain:gain,from:from,to:c.lv};
  S.rankPos=S.score>0?rankAdd(S.did,{n:nickOf(),c:S.castle.id,s:S.score,w:S.wave,v:win?1:0,k:S.kills}):0;
  saveMeta();
  logRun(win?'win':S.quit?'quit':'lose');
  S.modal='end';renderOverlay();
}

/* ---------- Rysowanie sceny ---------- */
/* Dymek z podpowiedzią na planszy (linie tekstu nad punktem x,y) */
function drawTip(g,x,y,lines){
  if(!lines||!lines.length)lines=['Brak sąsiadów'];
  g.save();g.font='600 10px "Chakra Petch",sans-serif';g.textAlign='left';g.textBaseline='middle';
  var w=0,i,lh=13;
  for(i=0;i<lines.length;i++)w=Math.max(w,g.measureText(lines[i]).width);
  w+=10;var h=lines.length*lh+6,bx=clamp(x-w/2,2,CW-w-2),by=clamp(y-h,2,CH-h-2);
  g.fillStyle='rgba(10,14,18,.92)';rr(g,bx,by,w,h,5);g.fill();g.strokeStyle='rgba(255,214,90,.7)';g.lineWidth=1;rr(g,bx,by,w,h,5);g.stroke();
  g.fillStyle='#e8eef2';
  for(i=0;i<lines.length;i++)g.fillText(lines[i],bx+5,by+3+lh*(i+.5));

}
function draw(){
  var i,t,g=ctx;
  g.setTransform(DPR,0,0,DPR,0,0);
  if(!S||!S.bg){g.fillStyle='#0f161c';g.fillRect(0,0,CW,CH);return}
  g.save();
  if(S.shake>0)g.translate(rnd(-1,1)*S.shake*16,rnd(-1,1)*S.shake*16);
  g.drawImage(S.bg,0,0,CW,CH);

  // kierunek marszu
  var off=(clock*26)%44;
  g.fillStyle='rgba(255,255,255,.08)';
  for(var d=off;d<S.path.len-24;d+=44){
    var p1=pathPos(d),p2=pathPos(d+5),an=Math.atan2(p2.y-p1.y,p2.x-p1.x);
    g.save();g.translate(p1.x,p1.y);g.rotate(an);poly(g,[[3,0],[-3,-3.5],[-3,3.5]]);g.fill();g.restore();
  }
  // portal kosmitów
  var a0=S.path.pts[0];
  g.save();g.translate(a0.x+4,a0.y);
  g.fillStyle='rgba(123,255,123,.12)';disc(g,0,0,18);
  g.strokeStyle='#7bff7b';g.lineWidth=2;
  for(i=0;i<3;i++){g.beginPath();g.arc(0,0,8+i*4,clock*(2+i*.7)+i*2,clock*(2+i*.7)+i*2+2.2);g.stroke()}
  g.restore();

  // pola specjalne
  for(var spk in S.spec){
    var kd=S.spec[spk],xy=spk.split(','),px=+xy[0]*T+T/2,py=+xy[1]*T+T/2;

    else if(kd==='power'){var pw=.5+.5*Math.sin(clock*3);g.fillStyle='rgba(255,210,63,'+(.12+.1*pw)+')';disc(g,px,py,14);g.fillStyle='rgba(255,210,63,.85)';poly(g,[[px,py-8],[px+6,py],[px,py+8],[px-6,py]]);g.fill()}
    else if(kd==='mine'){g.fillStyle='rgba(123,224,195,.22)';disc(g,px,py,13);g.fillStyle='#7be0c3';disc(g,px,py,6);g.fillStyle='#0d1217';g.font='700 9px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText('$',px,py+.5)}
    else{g.fillStyle='#6b7680';poly(g,[[px-11,py+8],[px-8,py-5],[px,py-10],[px+9,py-4],[px+12,py+8]]);g.fill();g.fillStyle='rgba(255,255,255,.18)';poly(g,[[px-8,py-5],[px,py-10],[px+2,py-2]]);g.fill()}
  }

  // mroźna aura zamku
  if(S.skills.e){
    var pu=.5+.5*Math.sin(clock*2);
    g.fillStyle='rgba(108,199,255,'+(.05+.03*pu)+')';disc(g,S.hero.x,S.hero.y,frostRad());
    g.strokeStyle='rgba(108,199,255,.3)';g.lineWidth=1;g.beginPath();g.arc(S.hero.x,S.hero.y,frostRad(),0,TAU);g.stroke();
  }

  // podgląd budowy
  if(S.build&&hover&&!S.modal){
    var ok=validCell(hover.c,hover.r),bd=TOWER[S.build];
    g.fillStyle=ok?'rgba(95,211,141,.18)':'rgba(255,107,107,.18)';
    g.fillRect(hover.c*T,hover.r*T,T,T);
    if(ok){
      g.strokeStyle='rgba(232,238,242,.35)';g.lineWidth=1;g.beginPath();
      g.arc(hover.c*T+T/2,hover.r*T+T/2,bd.range*S.mods.trange,0,TAU);g.stroke();
      g.globalAlpha=.55;drawTower(g,S.build,hover.c*T+T/2,hover.r*T+T/2,1.22,clock,-Math.PI/2,0,S.tup[S.build],0,false,S.skin[S.build]);g.globalAlpha=1;
      var pv=synCalc(S.build,hover.c,hover.r,null),pvx=hover.c*T+T/2,pvy=hover.r*T+T/2;
      pv.sameN.forEach(function(n){g.strokeStyle='rgba(255,107,107,.9)';g.lineWidth=2;g.setLineDash([4,3]);g.beginPath();g.moveTo(pvx,pvy);g.lineTo(n.x,n.y);g.stroke();g.setLineDash([])});
      pv.links.forEach(function(n){g.strokeStyle='rgba(95,211,141,.95)';g.lineWidth=2.5;g.beginPath();g.moveTo(pvx,pvy);g.lineTo(n.x,n.y);g.stroke()});
      drawTip(g,pvx,pvy-T,synText(pv));
    }
  }
  if(hover&&!S.modal&&S.spec[hover.c+','+hover.r]&&!S.build){var hs2=SPEC[S.spec[hover.c+','+hover.r]];drawTip(g,hover.c*T+T/2,hover.r*T-4,[hs2.n+': '+hs2.d])}

  // wieże
  for(i=0;i<S.towers.length;i++){
    t=S.towers[i];
    var st=tstat(t);
    if(S.sel===t){g.strokeStyle='rgba(255,178,62,.55)';g.lineWidth=1;g.beginPath();g.arc(t.x,t.y,st.range,0,TAU);g.stroke();
      g.strokeStyle='#ffb23e';g.strokeRect(t.c*T+1.5,t.r*T+1.5,T-3,T-3)}
    drawTower(g,t.type,t.x,t.y,1.22,clock,t.ang,t.rec,S.tup[t.type],t.ramp,S.buffT>0,S.skin[t.type]);
    if(t.sul){g.strokeStyle='rgba(190,120,255,'+(.5+.3*Math.sin(clock*8))+')';g.lineWidth=2;g.beginPath();g.arc(t.x,t.y,19,0,TAU);g.stroke();g.fillStyle='rgba(190,120,255,.9)';g.font='700 10px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText('\u29D7',t.x+13,t.y-15)}
  }

  // po\u0142\u0105czenia synergii na wierzchu wie\u017C: z\u0142ote kreski mi\u0119dzy s\u0105siadami z premi\u0105, czerwone przerywane do tego samego typu (zaznaczona wie\u017Ca)
  for(i=0;i<S.towers.length;i++){
    t=S.towers[i];var sy0=synOf(t),on=S.sel===t;
    for(var li=0;li<sy0.links.length;li++){
      var ln=sy0.links[li],mx=(t.x+ln.x)/2,my=(t.y+ln.y)/2;
      g.strokeStyle='rgba(255,214,90,'+(on?1:.75)+')';g.lineWidth=on?3.5:2.5;g.beginPath();g.moveTo(t.x+(ln.x-t.x)*.2,t.y+(ln.y-t.y)*.2);g.lineTo(t.x+(ln.x-t.x)*.5,t.y+(ln.y-t.y)*.5);g.stroke();
      g.fillStyle='#ffd65a';disc(g,mx,my,on?3:2.2);
    }
    if(on){for(var si2=0;si2<sy0.sameN.length;si2++){var sn=sy0.sameN[si2];g.strokeStyle='rgba(255,107,107,.95)';g.lineWidth=2.5;g.setLineDash([4,3]);g.beginPath();g.moveTo(t.x,t.y);g.lineTo(sn.x,sn.y);g.stroke();g.setLineDash([])}}
  }

  // wrogowie
  S.enemies.forEach(function(e){
    if(e.inv>0){
      var ip=.5+.5*Math.sin(clock*14);
      g.fillStyle='rgba(255,240,170,'+(.18+.14*ip)+')';g.fillRect(e.x-e.r*1.3,e.y-170,e.r*2.6,170+e.r);
      g.fillStyle='rgba(255,255,255,'+(.2+.2*ip)+')';disc(g,e.x,e.y,e.r*2.1);
    }
    if(e.bid==='sultan'){
      var sp=.5+.5*Math.sin(clock*3);
      g.fillStyle='rgba(170,90,230,'+(.05+.04*sp)+')';disc(g,e.x,e.y,SULTAN_R);
      g.strokeStyle='rgba(190,120,255,'+(.35+.2*sp)+')';g.lineWidth=1.5;g.setLineDash([6,6]);g.lineDashOffset=-clock*14;
      g.beginPath();g.arc(e.x,e.y,SULTAN_R,0,TAU);g.stroke();g.setLineDash([]);
    }
    if(e.bid==='hunter'&&e.dg>0){g.globalAlpha=.35;g.save();g.translate(-(Math.cos(e.ang||0))*14,-(Math.sin(e.ang||0))*14);drawEnemy(g,e,clock);g.restore();g.globalAlpha=1}
    drawEnemy(g,e,clock);
    var slowed=e.slowT>0||(S.skills.e&&dist(S.hero.x,S.hero.y,e.x,e.y)<=frostRad());
    if(slowed){g.strokeStyle='rgba(108,199,255,.8)';g.lineWidth=1.5;g.beginPath();g.arc(e.x,e.y,e.r+3,0,TAU);g.stroke()}
    if(e.poisT>0){g.fillStyle='rgba(123,224,90,.9)';for(var b=0;b<2;b++)disc(g,e.x+Math.sin(clock*5+b*3+e.ph)*e.r*.6,e.y-e.r-((clock*14+b*6)%10),1.3)}
    if(e.hp<e.max||e.type==='boss'){
      var w=e.type==='boss'?Math.max(40,e.r*2.4):Math.max(14,e.r*2),by=e.y-e.r-(e.type==='boss'?e.r*.55+14:e.type==='runner'?12:7);
      g.fillStyle='#0d1217';g.fillRect(e.x-w/2-1,by-1,w+2,e.type==='boss'?6:5);
      g.fillStyle=e.type==='boss'?'#ff7b5a':'#5fd38d';g.fillRect(e.x-w/2,by,w*Math.max(0,e.hp/e.max),e.type==='boss'?4:3);
      if(e.type==='boss'){g.fillStyle='#ffe9d8';g.font='700 10px "Chakra Petch",sans-serif';g.textAlign='center';g.textBaseline='bottom';g.fillText(e.bn+(e.bid==='god'&&!e.rev?' ✦':''),e.x,by-2)}
    }
  });

  // pociski
  S.shots.forEach(function(s){drawShot(g,s,clock)});

  // zamek
  var h=S.hero,hs=hstat(),low=S.baseHp/S.baseMax<.3;
  g.strokeStyle='rgba(255,255,255,.07)';g.lineWidth=1;g.beginPath();g.arc(h.x,h.y,hs.range,0,TAU);g.stroke();
  g.fillStyle='rgba(0,0,0,.35)';g.beginPath();g.ellipse(h.x,h.y+14,26,6,0,0,TAU);g.fill();
  if(S.buffT>0){g.strokeStyle='rgba(255,255,255,'+(.3+.2*Math.sin(clock*8))+')';g.lineWidth=2;g.beginPath();g.arc(h.x,h.y,34,0,TAU);g.stroke()}
  var crit=critHp();
  if(crit){var gp=.5+.5*Math.sin(clock*9);g.fillStyle='rgba(255,110,30,'+(.14+.1*gp)+')';disc(g,h.x,h.y,42)}
  drawCastle(g,S.castle,h.x,h.y,1,clock,{ang:h.ang,rec:h.rec,hit:S.hit,low:low});
  if(crit)drawFire(g,h.x,h.y,clock);
  var bw=46,bx=h.x-bw/2,by2=h.y+22;
  g.fillStyle='rgba(13,18,23,.85)';g.fillRect(bx-1,by2-1,bw+2,7);
  g.fillStyle=crit?(Math.sin(clock*12)>0?'#ff3b2f':'#ff9a2e'):low?'#ff6b6b':'#5fd38d';g.fillRect(bx,by2,bw*Math.max(0,S.baseHp/S.baseMax),5);
  g.fillStyle='#e8eef2';g.font='700 10px "Chakra Petch",sans-serif';g.textAlign='center';g.textBaseline='top';
  g.fillText(Math.max(0,S.baseHp)+' / '+S.baseMax,h.x,by2+8);

  // efekty
  S.fx.forEach(function(f){
    var k=f.t/f.life;
    if(f.k==='ring'){
      var rad=f.r+(f.max-f.r)*k;
      if(f.fill){g.globalAlpha=(1-k)*.22;g.fillStyle=f.color;disc(g,f.x,f.y,rad)}
      g.strokeStyle=f.color;g.globalAlpha=1-k;g.lineWidth=2;g.beginPath();g.arc(f.x,f.y,rad,0,TAU);g.stroke();g.globalAlpha=1;
    }else if(f.k==='p'){g.fillStyle=f.color;g.globalAlpha=1-k;g.fillRect(f.x-1.5,f.y-1.5,3,3);g.globalAlpha=1}
    else if(f.k==='smoke'){g.fillStyle='rgba(150,150,150,'+(.35*(1-k))+')';disc(g,f.x,f.y,f.r+(f.max-f.r)*k)}
    else if(f.k==='txt'){g.globalAlpha=Math.min(1,(1-k)*1.6);g.fillStyle=f.color;g.font='700 '+f.size+'px "Chakra Petch",sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(f.text,f.x,f.y);g.globalAlpha=1}
    else if(f.k==='bolt'){
      g.save();g.shadowColor=f.color;g.shadowBlur=8;g.strokeStyle='rgba(225,240,255,'+(1-k)+')';g.lineWidth=1.8;
      for(var j=0;j<f.pts.length-1;j++){
        var a=f.pts[j],b=f.pts[j+1],n=5;g.beginPath();g.moveTo(a.x,a.y);
        for(var q=1;q<n;q++){var u=q/n;g.lineTo(a.x+(b.x-a.x)*u+rnd(-4,4),a.y+(b.y-a.y)*u+rnd(-4,4))}
        g.lineTo(b.x,b.y);g.stroke();
      }
      g.restore();
    }else if(f.k==='beam'){
      g.save();g.shadowColor=f.color;g.shadowBlur=8;g.globalAlpha=1-k;g.strokeStyle=f.color;g.lineWidth=f.w;
      g.beginPath();g.moveTo(f.x1,f.y1);g.lineTo(f.x2,f.y2);g.stroke();g.strokeStyle='#ffffff';g.lineWidth=f.w*.4;g.stroke();g.restore();
    }
  });

  // błysk po trafieniu bazy
  if(S.hit>0){g.fillStyle='rgba(255,60,60,'+Math.min(.22,S.hit*.5)+')';g.fillRect(0,0,CW,CH)}

  // baner fali
  if(S.banner){
    var bn=S.banner,al=Math.min(1,bn.t/.25)*Math.min(1,(bn.life-bn.t)/.45),sc=1+.12*(1-Math.min(1,bn.t/.3));
    // baner jest na środku u góry; boczne popupy nagród mają ~27% szerokości z każdej strony
    g.save();g.translate(CW/2,34);g.scale(sc,sc);g.globalAlpha=al;
    var bfs=22,bw0;g.font='700 22px "Chakra Petch",sans-serif';
    bw0=g.measureText(bn.text).width;if(typeof bw0!=='number')bw0=bn.text.length*12;
    if(bw0>404){bfs=Math.max(12,Math.floor(22*404/bw0));g.font='700 '+bfs+'px "Chakra Petch",sans-serif';bw0=404}
    g.fillStyle='rgba(8,11,14,.55)';rr(g,-(bw0+36)/2,-22,bw0+36,44,8);g.fill();
    g.fillStyle=bn.boss?'#ff7b5a':S.castle.acc;g.textAlign='center';g.textBaseline='middle';
    g.fillText(bn.text,0,1);g.restore();g.globalAlpha=1;
  }
  g.restore();
}

/* Wyjście do menu startowego wstrzymuje grę (update() nic nie robi, gdy jest modal). Run można wznowić przyciskiem „Wznów grę”. */
function exitToMenu(){
  if(!S||S.modal||S.result)return;
  quitStop();S.build=null;S.live=true;S.modal='title';renderOverlay();
}
function resumeRun(){
  if(!S||!S.live||S.modal!=='title')return;
  S.modal=null;renderOverlay();ui();
}
function startNew(){newRun();S.live=true;S.modal=null;cache={};tbCache={};renderOverlay();ui()}

/* ---------- Wejście ---------- */
function cvPos(ev){var r=cv.getBoundingClientRect();return {x:(ev.clientX-r.left)*CW/r.width,y:(ev.clientY-r.top)*CH/r.height}}
cv.addEventListener('pointermove',function(ev){var p=cvPos(ev);hover={c:Math.floor(p.x/T),r:Math.floor(p.y/T)}});
cv.addEventListener('pointerleave',function(){hover=null});
cv.addEventListener('contextmenu',function(e){e.preventDefault()});
cv.addEventListener('pointerdown',function(ev){
  if(!S||S.modal||ev.button===2)return;
  var p=cvPos(ev),c=Math.floor(p.x/T),r=Math.floor(p.y/T);
  hover={c:c,r:r};
  var t=towerAt(c,r);
  if(t){S.sel=t;return}
  if(S.build){tryBuild(c,r);return}
  S.sel=null;
});
function toggleBuild(k){
  if(S.build!==k&&towerCount(k)>=TLIMIT){dragHint('Limit '+TLIMIT+' wież tego typu');return}
  S.build=S.build===k?null:k;if(S.build)S.sel=null;
}
/* Dotyk: przytrzymaj wieżę na pasku, przeciągnij na planszę i puść, żeby postawić (zamiast „kliknij, kliknij”). Mysz i klawisze działają jak dawniej. */
var drag=null,dragNoClick=false,dragHintEl=null,dragHintT=0,DRAG_HOLD=180,DRAG_OFF=48;
function dragCell(ev){
  var r=cv.getBoundingClientRect(),x=ev.clientX,y=ev.clientY-DRAG_OFF;
  if(x<r.left||x>r.right||y<r.top||y>r.bottom)return null;
  var p=cvPos({clientX:x,clientY:y});
  return {c:Math.floor(p.x/T),r:Math.floor(p.y/T)};
}
function dragHint(msg){
  if(!dragHintEl){dragHintEl=document.createElement('div');dragHintEl.id='dhint';document.body.appendChild(dragHintEl)}
  dragHintEl.textContent=msg;dragHintEl.className='show';
  clearTimeout(dragHintT);dragHintT=setTimeout(function(){dragHintEl.className=''},1800);
}
function dragStart(){
  if(!drag||drag.on)return;
  clearTimeout(drag.timer);
  if(!S||S.modal)return;
  if(towerCount(drag.k)>=TLIMIT){dragHint('Limit '+TLIMIT+' wież tego typu');drag.dead=true;return}
  if(S.gold<towerCost(drag.k)){dragHint('Za mało złota na tę wieżę');drag.dead=true;return}
  drag.on=true;S.build=drag.k;S.sel=null;
  if(navigator.vibrate)navigator.vibrate(15);
}
function dragEnd(ev,drop){
  var d=drag;drag=null;if(!d)return;
  clearTimeout(d.timer);
  setTimeout(function(){dragNoClick=false},400);
  if(d.on){
    var cell=drop?dragCell(ev):null;
    if(cell&&S&&!S.modal)tryBuild(cell.c,cell.r);
    S.build=null;hover=null;
  }else if(drop&&!d.dead)dragHint('Przytrzymaj wieżę i przeciągnij na planszę');
}
document.addEventListener('pointerdown',function(ev){
  if(ev.pointerType!=='touch')return;
  var el=ev.target.closest&&ev.target.closest('.tb');
  if(!el||!S||S.modal||drag)return;
  dragNoClick=true;
  drag={id:ev.pointerId,k:el.getAttribute('data-k'),x:ev.clientX,y:ev.clientY,on:false,dead:false,timer:setTimeout(dragStart,DRAG_HOLD)};
});
document.addEventListener('pointermove',function(ev){
  if(!drag||ev.pointerId!==drag.id)return;
  if(!drag.on&&!drag.dead&&Math.abs(ev.clientX-drag.x)+Math.abs(ev.clientY-drag.y)>12)dragStart();
  if(drag&&drag.on){ev.preventDefault();hover=dragCell(ev)}
});
document.addEventListener('pointerup',function(ev){if(drag&&ev.pointerId===drag.id)dragEnd(ev,true)});
document.addEventListener('pointercancel',function(ev){if(drag&&ev.pointerId===drag.id)dragEnd(ev,false)});
document.addEventListener('contextmenu',function(e){if(e.target.closest&&e.target.closest('.tb'))e.preventDefault()});
function cycleSpeed(){S.speed=S.speed===1?2:S.speed===2?3:1}
document.addEventListener('click',function(ev){
  var el=ev.target.closest&&ev.target.closest('[data-act]');if(!el||!S)return;
  var a=el.getAttribute('data-act');
  if(a==='build'){if(!S.modal&&!dragNoClick)toggleBuild(el.getAttribute('data-k'))}
  else if(a==='sell')sellTower(S.sel);
  else if(a==='pick')pickCard(+el.getAttribute('data-i'));
  else if(a==='lv-toggle')lvToggle(el.getAttribute('data-k')||undefined);
  else if(a==='lv-pick')lvPick(+el.getAttribute('data-i'));
  else if(a==='new')startNew();
  else if(a==='go-title'){S.modal='title';renderOverlay()}
  else if(a==='go-setup'){S.modal='menu';renderOverlay()}
  else if(a==='go-shop'){S.modal='shop';renderOverlay()}
  else if(a==='go-help'){S.modal='help';renderOverlay()}

  else if(a==='clear-runs'){if(typeof confirm!=='function'||confirm('Usunąć zapis wszystkich zapisanych gier?')){try{localStorage.removeItem(RUNKEY)}catch(e){}renderOverlay()}}
  else if(a==='bug'){if(S.modal!=='bug'){quitStop();S.bugPrev=S.modal;S.modal='bug';renderOverlay()}}
  else if(a==='bug-close')bugClose();
  else if(a==='bug-sent')setTimeout(function(){bugText='';bugClose()},0);
  else if(a==='go-rank'){rankTab=meta.diff;S.modal='rank';renderOverlay()}
  else if(a==='rank-tab'){rankTab=el.getAttribute('data-id');renderOverlay()}
  else if(a==='go-mode'){S.modeId=el.getAttribute('data-id');S.modal='mode';renderOverlay()}
  else if(a==='go-secret'){S.modal='secret';renderOverlay()}
  else if(a==='diff'){
    meta.diff=el.getAttribute('data-id');saveMeta();
    if(S.modal==='menu'){newRun();S.modal='menu';cache={};tbCache={}}
    renderOverlay();
  }
  else if(a==='fac'){
    meta.fac=el.getAttribute('data-id');saveMeta();
    if(S.modal==='menu'){newRun();S.modal='menu';cache={};tbCache={}}
    renderOverlay();
  }
  else if(a==='castle'){
    meta.castle=el.getAttribute('data-id');saveMeta();
    if(S.modal==='menu'){newRun();S.modal='menu';cache={};tbCache={}}
    renderOverlay();
  }
  else if(a==='buy'){
    var m=META.filter(function(x){return x.id===el.getAttribute('data-id')})[0],l=ml(m.id),cost=m.c(l);
    if(m&&l<m.max&&meta.crystals>=cost){meta.crystals-=cost;meta.lv[m.id]=l+1;saveMeta();renderOverlay()}
  }
});
document.addEventListener('input',function(ev){
  var t=ev.target;if(!t)return;
  if(t.id==='bugtxt'){bugText=String(t.value||'').slice(0,1500);var a=$('bugsend');if(a)a.href=bugUrl();return}
  if(t.id==='share'){meta.share=!!t.checked;saveMeta();return}
  if(t.id!=='nick')return;
  meta.nick=String(t.value||'').slice(0,NICKMAX);saveMeta();
});
/* Pełny ekran: przeglądarka pozwala wejść w niego tylko po geście użytkownika, więc włączamy go przy pierwszym kliknięciu lub klawiszu. Przycisk ⛶ przełącza go ręcznie. */
function fsOn(){
  var de=document.documentElement,p;if(!de)return p;
  try{var f=de.requestFullscreen||de.webkitRequestFullscreen;if(f){p=f.call(de);if(p&&p.catch)p.catch(function(){})}}catch(e){}
  return p;
}
/* „Obróć i graj”: pełny ekran + blokada orientacji poziomej (działa tam, gdzie przeglądarka na to pozwala; w innych przypadkach prosimy o ręczny obrót). */
function rotGo(){
  var note=$('rotnote');
  function fail(){if(note)note.textContent='Ta przeglądarka nie pozwala wymusić obrotu. Obróć telefon ręcznie.'}
  try{Promise.resolve(fsOn()).then(function(){var o=screen.orientation;if(o&&o.lock)return o.lock('landscape');throw 0}).catch(fail)}catch(e){fail()}
}
function fsOff(){
  try{var f=document.exitFullscreen||document.webkitExitFullscreen;if(f){var p=f.call(document);if(p&&p.catch)p.catch(function(){})}}catch(e){}
}
function fsActive(){return !!(document.fullscreenElement||document.webkitFullscreenElement)}
var fsAuto=false;
function fsFirst(ev){
  if(fsAuto)return;
  if(ev&&ev.target&&ev.target.closest&&ev.target.closest('#fs'))return;
  if(ev&&ev.type==='keydown'&&(ev.key==='Escape'||ev.key==='F11'))return;
  fsAuto=true;if(!fsActive())fsOn();
}
document.addEventListener('pointerdown',fsFirst);
document.addEventListener('keydown',fsFirst);
$('fs').addEventListener('click',function(){if(fsActive())fsOff();else fsOn();fsAuto=true});
$('go').addEventListener('click',startWave);
/* „Zakończ grę”: trzeba przytrzymać 3 s (mysz, dotyk albo Enter/Spacja); puszczenie przycisku wcześniej anuluje. Bez dodatkowego potwierdzenia. */
var quitT=0,QUITMS=3000;
function quitStop(){clearTimeout(quitT);quitT=0;$('quit').classList.remove('hold')}
function quitStart(){
  if(!S||S.modal||quitT)return;
  $('quit').classList.add('hold');
  quitT=setTimeout(function(){quitT=0;$('quit').classList.remove('hold');if(S&&!S.modal){S.quit=true;endRun(false)}},QUITMS);
}
(function(){
  var q=$('quit');
  q.addEventListener('pointerdown',function(ev){if(ev.button===0||ev.button===undefined)quitStart()});
  ['pointerup','pointerleave','pointercancel','blur'].forEach(function(n){q.addEventListener(n,quitStop)});
  q.addEventListener('contextmenu',function(ev){ev.preventDefault()});
  q.addEventListener('keydown',function(ev){
    if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();ev.stopPropagation();if(!ev.repeat)quitStart()}
  });
  q.addEventListener('keyup',function(ev){if(ev.key==='Enter'||ev.key===' '){ev.stopPropagation();quitStop()}});
})();
$('exit').addEventListener('click',function(ev){if(ev.currentTarget&&ev.currentTarget.blur)ev.currentTarget.blur();exitToMenu()});
$('spd').addEventListener('click',function(){if(S)cycleSpeed()});
document.addEventListener('keydown',function(ev){
  if(!S||ev.ctrlKey||ev.metaKey||ev.altKey)return;
  var k=ev.key.toLowerCase();
  if(S.modal==='cards'){if(k>='1'&&k<='3')pickCard(+k-1);return}
  if(k==='escape'&&S.modal==='bug'){bugClose();return}
  if(k==='escape'&&(S.modal==='rank'||S.modal==='mode'||S.modal==='secret')){S.modal='title';renderOverlay();return}
  if(S.modal)return;
  if(k==='enter'){ev.preventDefault();lvToggle();return}
  if(S.lvOpen){if(k>='1'&&k<='3'){lvPick(+k-1);return}if(k==='escape'){S.lvOpen=false;lvKey='';ui();return}}
  if(k===' ')ev.preventDefault();
  if(k>='1'&&k<='8')toggleBuild(TKEYS[+k-1]);
  else if(k===' ')startWave();
  else if(k==='f')cycleSpeed();
  else if(k==='escape'){S.build=null;S.sel=null}
});

/* ---------- Pętla ---------- */
var last=0;
function frame(ts){
  clock=ts/1000;
  var dt=Math.min(.05,(ts-last)/1000||0);last=ts;
  if(S){for(var i=0;i<S.speed;i++)update(dt);draw();ui()}
  requestAnimationFrame(frame);
}
loadMeta();newRun();S.modal='title';renderOverlay();
if(typeof window!=='undefined'&&window.__TEST){
  window.__game={get S(){return S},update:update,newRun:newRun,startWave:startWave,tryBuild:tryBuild,pickCard:pickCard,draw:draw,ui:ui,validCell:validCell,towerCost:towerCost,towerCount:towerCount,synCalc:synCalc,TLIMIT:TLIMIT,renderOverlay:renderOverlay,dealDamage:dealDamage,openCards:openCards,lvToggle:lvToggle,lvPick:lvPick,meta:function(){return meta},MAXWAVE:MAXWAVE,CASTLES:CASTLES,TKEYS:TKEYS,drawCastle:drawCastle,drawTower:drawTower,drawEnemy:drawEnemy,ENEMY:ENEMY,setClock:function(v){clock=v},setCastle:function(id){meta.castle=id},setDiff:function(id){meta.diff=id},setFaction:function(id){meta.fac=id},FAC:FAC};
}else requestAnimationFrame(frame);
})();
</script>
